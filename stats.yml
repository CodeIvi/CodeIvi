name: Update GitHub Stats

on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
stats:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate GitHub Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=CodeIvi&show_icons=true&include_all_commits=true&count_private=false&theme=tokyonight&hide_border=true
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=CodeIvi&layout=compact&langs_count=10&theme=tokyonight&hide_border=true
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Repository Card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=CodeIvi&repo=Spoon-Knife&show_owner=true&theme=tokyonight&hide_border=true
      path: profile/spoon-knife.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "Update GitHub statistics" || exit 0
      git push
```
